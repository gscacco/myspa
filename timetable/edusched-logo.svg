  <rect x="205" y="73" width="28" height="66" rx="14" fill="#16477F"/>
  <rect x="407" y="73" width="28" height="66" rx="14" fill="#16477F"/>

  <!-- Timetable cells -->
  <g>
    <rect x="177" y="173" width="87" height="43" rx="9" fill="#438FF0"/>
    <rect x="276" y="173" width="87" height="43" rx="9" fill="#DCE5F2"/>
    <rect x="375" y="173" width="87" height="43" rx="9" fill="#438FF0"/>

    <rect x="177" y="228" width="87" height="43" rx="9" fill="#43A69C"/>
    <rect x="276" y="228" width="87" height="43" rx="9" fill="#FFB323"/>
