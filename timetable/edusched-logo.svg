  <path d="M439 96 V142" fill="none" stroke="#FFB323" stroke-width="5"/>
  <circle cx="439" cy="148" r="7" fill="#FFB323"/>
  <path d="M439 153 Q427 173 439 185 Q451 173 439 153" fill="#FFB323"/>

