      <stop offset="1" stop-color="#0863D8"/>
    </linearGradient>
  </defs>

  <!-- Calendar -->
  <rect x="145" y="95" width="350" height="270" rx="32" fill="url(#blue)"/>
  <rect x="165" y="153" width="310" height="190" rx="15" fill="#FFFFFF"/>

