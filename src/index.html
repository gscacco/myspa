<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foglio di calcolo</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231d6f42'/%3E%3Crect x='12' y='9' width='40' height='46' rx='3' fill='white'/%3E%3Cpath d='M12 21h40M25 21v34M39 21v34M12 32h40M12 43h40' fill='none' stroke='%231d6f42' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="top">
  <button data-action="save">💾 Salva</button><button data-action="open">📂 Apri</button>
  <button data-action="export-data" title="Esporta dati del workbook e codice ClojureScript">📤 Esporta dati</button>
  <button data-action="import-data" title="Importa dati e codice da un file EDN">📥 Importa dati</button><i></i>
  <button data-action="undo">↶</button><button data-action="redo">↷</button><i></i>
  <button data-action="toggle-bold"><b>B</b></button><button data-action="dec-minus">.0←</button><button data-action="dec-plus">.0→</button>
  <input type="color" data-action="bg-color" value="#fff2a8" title="Colore di sfondo"><button data-action="bg-clear">senza sfondo</button><i></i>
  <button id="bflow" class="on" data-action="toggle-flow" title="Evidenzia sorgenti (blu) e dipendenti (arancio)">Flusso</button>
  <button id="bfn" data-action="toggle-functions">ƒ CLJS</button>
  <button id="bhelp" data-action="help" aria-haspopup="dialog" aria-controls="help-overlay">Help</button>
  <button id="bexplore" data-action="explore-data">Explore Data</button>
  <button id="bmessages" data-action="toggle-messages" aria-expanded="false" aria-controls="messages-panel">Messages <span id="messages-badge" aria-label="Retained messages">0</span></button>
  <span id="stat" data-dyn></span>
</div>
<div id="help-overlay" class="help-overlay" hidden>
  <section class="help-dialog" role="dialog" aria-modal="true" aria-labelledby="help-title">
    <header class="help-header">
      <div><b id="help-title">Aiuto ClojureScript</b><p>Funzioni, forme, valori ed eventi disponibili nel foglio.</p></div>
      <input data-help-search type="search" placeholder="Cerca una funzione o keyword" aria-label="Cerca nell’aiuto">
      <button data-help-close type="button" aria-label="Chiudi aiuto">×</button>
    </header>
    <div class="help-layout">
      <nav data-help-list aria-label="Indice dell’aiuto"></nav>
      <article data-help-detail aria-live="polite"></article>
    </div>
    <footer class="help-footer">
      <span data-help-status role="status" aria-live="polite"></span>
      <button data-help-copy type="button">Copia esempio</button>
      <button data-help-insert type="button">Inserisci nell’editor</button>
    </footer>
  </section>
</div>
<div id="data-explorer" class="data-explorer-overlay" hidden>
  <section class="data-explorer-panel" role="dialog" aria-modal="true" aria-labelledby="data-explorer-title">
    <header class="data-explorer-header">
      <div class="explorer-heading">
        <b id="data-explorer-title">Explore Data</b>
        <div class="explorer-location"></div>
        <div class="explorer-selected-path"></div>
      </div>
      <div class="explorer-header-actions">
        <button data-copy-selected-edn type="button">Copy selected EDN</button>
        <button data-copy-select-expression type="button">Copy select expression</button>
        <button data-copy-path type="button">Copy path</button>
        <button data-explorer-close type="button" aria-label="Close data explorer">×</button>
      </div>
    </header>
    <div class="data-explorer-status" role="status" aria-live="polite"></div>
    <main class="data-explorer-tree" aria-label="ClojureScript value tree"></main>
  </section>
</div>
<div id="fb"><input id="nb" readonly><b>ƒx</b><input id="fx" spellcheck="false"><span id="vv" data-dyn></span></div>
<div id="gw"><div id="gx"><table id="g" data-dyn></table><div id="ov"><div id="fh" title="Fill cells"></div></div></div></div>
<section id="messages-panel" aria-label="Messages" hidden>
  <div id="messages-resizer" role="separator" aria-label="Resize Messages panel" aria-orientation="horizontal" aria-valuemin="160" aria-valuemax="900" tabindex="0"></div>
  <header class="messages-header">
    <div class="messages-title"><b>Messages</b><span data-message-count>0 retained · 0 discarded</span></div>
    <div class="messages-controls">
      <div class="messages-levels" role="group" aria-label="Filter by severity">
        <button type="button" data-level="info" aria-pressed="true">INFO</button>
        <button type="button" data-level="warn" aria-pressed="true">WARN</button>
        <button type="button" data-level="error" aria-pressed="true">ERROR</button>
        <button type="button" data-level="debug" aria-pressed="true">DEBUG</button>
      </div>
      <select data-category-filter aria-label="Filter by category"><option value="">All categories</option></select>
      <input data-message-search type="search" placeholder="Search messages" aria-label="Search messages">
    </div>
    <div class="messages-actions">
      <button type="button" data-copy-messages>Copy filtered</button>
      <button type="button" data-export-messages>Export all</button>
      <button type="button" data-clear-messages>Clear</button>
      <button type="button" data-close-messages aria-label="Close Messages">×</button>
    </div>
  </header>
  <div id="messages-list" role="log" aria-label="Application messages" aria-live="off" tabindex="0">
    <div id="messages-virtual-list"><div class="messages-rows"></div></div>
  </div>
  <div class="messages-status" role="status" aria-live="polite"></div>
</section>
<div id="tabs" data-dyn></div>
<footer id="selection-summary" aria-label="Riepilogo selezione" aria-live="polite"></footer>
<div id="fn" role="dialog" aria-modal="false" aria-labelledby="fn-title" hidden>
  <div id="fn-head"><b id="fn-title">User-defined functions (ClojureScript)</b><div id="fn-actions"><button id="apply-code" type="button" title="Apply all function definitions" aria-label="Apply all function definitions">✓</button><button id="close-code" type="button" title="Close code editor" aria-label="Close code editor">×</button></div></div>
  <div id="ce"><div id="ln" data-dyn></div><div id="cw"><pre id="hl" data-dyn></pre><textarea id="code" aria-label="ClojureScript code or cell formula" wrap="off" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea><div id="pop" hidden data-dyn></div></div></div>
  <div id="fe" data-dyn></div>
  <div id="note" data-dyn role="status" aria-live="polite"></div>
</div>

<script type="application/edn" id="model">
{:version 1
 :name "Foglio di calcolo"
 :code "; User-defined functions in ClojureScript: symbols declared with def/defn are available in formulas.\n(def TAX_RATE 0.22)\n\n(defn WITH_TAX\n  ([x] (WITH_TAX x TAX_RATE))\n  ([x rate] (* x (+ 1 rate))))\n\n; Accepts matrices (vectors of rows); flatten turns them into sequences.\n(defn WEIGHTED_AVERAGE [values weights]\n  (let [value-list (flatten values)\n        weight-list (flatten weights)]\n    (/ (SUM (map * value-list weight-list)) (SUM weight-list))))\n"
 :sheets [{:name "Foglio1"
  :cells {:A1 {:r "Prodotto" :b true} :B1 {:r "Prezzo" :b true} :C1 {:r "Qtà" :b true} :D1 {:r "Totale" :b true} :E1 {:r "Con IVA" :b true}
          :A2 {:r "Penna"} :B2 {:r 1.5 :d 2} :C2 {:r 100} :D2 {:r "=B2*C2" :d 2} :E2 {:r "=WITH_TAX(D2)" :d 2}
          :A3 {:r "Quaderno"} :B3 {:r 3.2 :d 2} :C3 {:r 40} :D3 {:r "=B3*C3" :d 2} :E3 {:r "=WITH_TAX(D3)" :d 2}
          :A4 {:r "Zaino"} :B4 {:r 24.9 :d 2} :C4 {:r 12} :D4 {:r "=B4*C4" :d 2} :E4 {:r "=WITH_TAX(D4)" :d 2}
          :A5 {:r "Lavagna"} :B5 {:r 89 :d 2} :C5 {:r 3} :D5 {:r "=B5*C5" :d 2} :E5 {:r "=WITH_TAX(D5)" :d 2}
          :A6 {:r "Totale" :b true} :D6 {:r "=SUM(D2:D5)" :d 2 :b true} :E6 {:r "=SUM(E2:E5)" :d 2 :b true}
          :A8 {:r "Prezzo medio pesato"} :D8 {:r "=WEIGHTED_AVERAGE(B2:B5, C2:C5)" :d 3}
          :A9 {:r "Fascia"} :D9 {:r "=D6>1000?\"Alta\":\"Bassa\""}}}
  {:name "Foglio2" :cells {:A1 {:r "Totale con IVA (da Foglio1)" :b true} :D1 {:r "=Foglio1!E6" :d 2}}}]}
</script>

<script src="../node_modules/scittle/dist/scittle.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
