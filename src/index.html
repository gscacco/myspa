<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foglio di calcolo</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231d6f42'/%3E%3Crect x='12' y='9' width='40' height='46' rx='3' fill='white'/%3E%3Cpath d='M12 21h40M25 21v34M39 21v34M12 32h40M12 43h40' fill='none' stroke='%231d6f42' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="top">
  <button data-action="save">💾 Salva</button><button data-action="open">📂 Apri</button><i></i>
  <button data-action="undo">↶</button><button data-action="redo">↷</button><i></i>
  <button data-action="toggle-bold"><b>B</b></button><button data-action="dec-minus">.0←</button><button data-action="dec-plus">.0→</button>
  <input type="color" data-action="bg-color" value="#fff2a8" title="Colore di sfondo"><button data-action="bg-clear">senza sfondo</button><i></i>
  <button id="bflow" class="on" data-action="toggle-flow" title="Evidenzia sorgenti (blu) e dipendenti (arancio)">Flusso</button>
  <button id="bfn" data-action="toggle-functions">ƒ CLJS</button>
  <span id="stat" data-dyn></span>
</div>
<div id="fb"><input id="nb" readonly><b>ƒx</b><input id="fx" spellcheck="false"><span id="vv" data-dyn></span></div>
<div id="gw"><div id="gx"><table id="g" data-dyn></table><div id="ov"><div id="fh" title="Fill cells"></div></div></div></div>
<div id="tabs" data-dyn></div>
<div id="fn" role="dialog" aria-modal="false" aria-labelledby="fn-title" hidden>
  <div id="fn-head"><b id="fn-title">User-defined functions (ClojureScript)</b><div id="fn-actions"><button id="apply-code" type="button" title="Apply all function definitions" aria-label="Apply all function definitions">✓</button><button id="close-code" type="button" title="Close code editor" aria-label="Close code editor">×</button></div></div>
  <div id="ce"><div id="ln" data-dyn></div><div id="cw"><pre id="hl" data-dyn></pre><textarea id="code" aria-label="ClojureScript code or cell formula" wrap="off" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea><div id="pop" hidden data-dyn></div></div></div>
  <div id="fe" data-dyn></div>
  <div id="note" data-dyn role="status" aria-live="polite"></div>
</div>

<script type="application/edn" id="model">
{:version 1
 :name "Foglio di calcolo"
 :code "; User-defined functions in ClojureScript: symbols declared with def/defn are available in formulas.\n(def TAX_RATE 0.22)\n\n(defn WITH_TAX\n  ([x] (WITH_TAX x TAX_RATE))\n  ([x rate] (* x (+ 1 rate))))\n\n; Accepts matrices (vectors of rows); flatten turns them into sequences.\n(defn WEIGHTED_AVERAGE [values weights]\n  (let [value-list (flatten values)\n        weight-list (flatten weights)]\n    (/ (SUM (map * value-list weight-list)) (SUM weight-list))))\n"
 :sheets [{:name "Foglio1"
  :cells {:A1 {:r "Prodotto" :b true} :B1 {:r "Prezzo" :b true} :C1 {:r "Qtà" :b true} :D1 {:r "Totale" :b true} :E1 {:r "Con IVA" :b true}
          :A2 {:r "Penna"} :B2 {:r 1.5 :d 2} :C2 {:r 100} :D2 {:r "=B2*C2" :d 2} :E2 {:r "=WITH_TAX(D2)" :d 2}
          :A3 {:r "Quaderno"} :B3 {:r 3.2 :d 2} :C3 {:r 40} :D3 {:r "=B3*C3" :d 2} :E3 {:r "=WITH_TAX(D3)" :d 2}
          :A4 {:r "Zaino"} :B4 {:r 24.9 :d 2} :C4 {:r 12} :D4 {:r "=B4*C4" :d 2} :E4 {:r "=WITH_TAX(D4)" :d 2}
          :A5 {:r "Lavagna"} :B5 {:r 89 :d 2} :C5 {:r 3} :D5 {:r "=B5*C5" :d 2} :E5 {:r "=WITH_TAX(D5)" :d 2}
          :A6 {:r "Totale" :b true} :D6 {:r "=SUM(D2:D5)" :d 2 :b true} :E6 {:r "=SUM(E2:E5)" :d 2 :b true}
          :A8 {:r "Prezzo medio pesato"} :D8 {:r "=WEIGHTED_AVERAGE(B2:B5, C2:C5)" :d 3}
          :A9 {:r "Fascia"} :D9 {:r "=D6>1000?\"Alta\":\"Bassa\""}}}
  {:name "Foglio2" :cells {:A1 {:r "Totale con IVA (da Foglio1)" :b true} :D1 {:r "=Foglio1!E6" :d 2}}}]}
</script>

<script src="../node_modules/scittle/dist/scittle.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
